<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12141a">
<title>eOS chat</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='icon.svg') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">

<body class="chat">

<section id="signin" class="panel narrow" hidden>
  <h1>eOS</h1>
  <form id="signin-form">
    <label class="field"><span>Username</span>
      <input id="username" autocomplete="username" required></label>
    <label class="field"><span>Password</span>
      <input id="password" type="password" autocomplete="current-password" required></label>
    <button class="primary" type="submit">Sign in</button>
  </form>
  <p id="signin-error" class="notice error" hidden></p>
</section>

<div id="app" hidden>
  <header class="bar">
    <button id="back" type="button" hidden aria-label="Back to conversations">‹</button>
    <h1 id="title">eOS</h1>
    <span id="link" class="chip" title="Connection to the relay">…</span>
    <button id="signout" type="button">Sign out</button>
  </header>

  <div class="split">
    <aside id="conversations" class="panel" aria-label="Conversations"></aside>

    <section id="thread" class="panel">
      <div id="messages" role="log" aria-live="polite"></div>
      <form id="composer">
        <input id="draft" placeholder="Message…" autocomplete="off" maxlength="2000" disabled>
        <button class="primary" type="submit" disabled>Send</button>
      </form>
    </section>
  </div>
</div>

<script type="module" src="{{ url_for('static', filename='app.js') }}"></script>
