<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}eOS admin{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<link rel="icon" href="{{ url_for('static', filename='icon.svg') }}">

<body class="admin">
<header class="bar">
  <h1>eOS</h1>
  {% if admin %}
    <nav>
      <a href="{{ url_for('admin.users') }}">People</a>
      <a href="{{ url_for('admin.groups') }}">Conversations</a>
      <a href="{{ url_for('pwa.index') }}">Chat</a>
      <a href="{{ url_for('admin.logout') }}">Sign out</a>
    </nav>
  {% endif %}
</header>

<main>
  {% with messages = get_flashed_messages() %}
    {% for message in messages %}
      <p class="notice">{{ message }}</p>
    {% endfor %}
  {% endwith %}

  {% block body %}{% endblock %}
</main>
